<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OrderLah · WhatsApp Simulator</title>
<link rel="stylesheet" href="/app.css">
<style>
  .phones { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; padding: 16px 20px 28px; max-width: 1600px; margin: 0 auto; }
  .phone { display: flex; flex-direction: column; height: calc(100vh - 150px); min-height: 560px; border-radius: 22px; overflow: hidden; border: 1px solid var(--border); background: var(--surface); box-shadow: var(--shadow); }
  .phone-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--accent); color: #fff; }
  .avatar { width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,.22); display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .who span { font-size: 12px; opacity: .85; }
  .who select { display: block; margin-bottom: 2px; }
  .phone-head select { max-width: 150px; border-radius: 8px; border: 0; padding: 4px 6px; background: rgba(255,255,255,.95); color: #1d2420; font-size: 12.5px; }
  .leave-tag { font-size: 11px; background: #fff3dc; color: #7a4d00; border-radius: 999px; padding: 1px 7px; font-weight: 700; }
  .chat { flex: 1; overflow-y: auto; padding: 12px 10px; background: var(--chat-bg); display: flex; flex-direction: column; gap: 6px; }
  .empty { margin: auto; text-align: center; color: var(--muted); font-size: 13px; max-width: 220px; }
  .msg { max-width: 86%; padding: 7px 10px 5px; border-radius: 10px; background: var(--bubble-in); box-shadow: 0 1px 0 rgba(0,0,0,.06); white-space: pre-wrap; word-wrap: break-word; font-size: 13.5px; }
  .msg.me { align-self: flex-end; background: var(--bubble-out); border-top-right-radius: 3px; }
  .msg.them { align-self: flex-start; border-top-left-radius: 3px; }
  .msg time { display: block; text-align: right; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
  .msg .sub { display: block; font-style: italic; color: var(--muted); font-size: 12.5px; margin-top: 3px; }
  .msg .err { display: block; color: var(--crit); font-size: 12px; }
  .msg a { word-break: break-all; }
  .buttons { align-self: flex-start; display: flex; flex-direction: column; gap: 4px; width: min(86%, 300px); margin-top: -2px; }
  .buttons button { border: 0; background: var(--bubble-in); color: var(--info); font-weight: 600; padding: 8px; border-radius: 10px; box-shadow: 0 1px 0 rgba(0,0,0,.06); }
  .buttons button:hover:not(:disabled) { filter: brightness(.97); }
  .buttons button:disabled { color: var(--muted); }
  .buttons button.chosen { color: var(--accent-ink); background: var(--accent-soft); }
  .doc { display: flex; align-items: center; gap: 10px; text-decoration: none; color: inherit; background: var(--surface-2); border-radius: 8px; padding: 8px; margin-bottom: 4px; }
  .doc .ico { width: 34px; height: 40px; border-radius: 4px; background: var(--crit); color: #fff; font-size: 10px; font-weight: 800; display: grid; place-items: center; flex: none; }
  .composer { border-top: 1px solid var(--border); background: var(--surface); padding: 8px; display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; gap: 6px; align-items: center; }
  .row input[type=text] { flex: 1; min-width: 0; border: 1px solid var(--border); border-radius: 999px; padding: 8px 12px; background: var(--surface-2); }
  .icon-btn { width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; flex: none; font-size: 16px; }
  .icon-btn.on { background: var(--warn-soft); border-color: var(--warn); }
  .send { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--accent); color: #fff; flex: none; font-size: 15px; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; max-height: 64px; overflow-y: auto; padding-bottom: 2px; }
  .chip { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 3px 9px; font-size: 12px; white-space: nowrap; color: var(--muted); }
  .chip:hover { color: var(--text); border-color: var(--accent); }
  .hint { font-size: 11.5px; color: var(--warn); padding: 0 4px; }
  .attach { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .attach img { height: 34px; border-radius: 4px; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand"><div class="logo">OL</div>OrderLah <small>WhatsApp simulator</small></div>
  <nav><a href="/simulator.html" class="active">Simulator</a><a href="/inbox.html" target="_blank">Orbyte inbox ↗</a><a href="/dashboard.html" target="_blank">Orders ↗</a></nav>
  <div class="spacer"></div>
  <span class="badge" id="modeAi">AI: …</span>
  <span class="badge" id="modeWa">WhatsApp: …</span>
  <button class="btn small primary" id="scenario">▶ Inbox scenario</button>
  <button class="btn small" id="reset">Reset demo</button>
</div>

<div class="phones" id="phones"></div>
<div class="toast" id="toast"></div>

<script>
const CUSTOMERS = [
  { phone: '60120000011', name: 'Aina' },
  { phone: '60120000012', name: 'Mei Ling' },
  { phone: '60120000013', name: 'Ali' },
  { phone: '60120000014', name: 'Kevin' },
  { phone: '60120000015', name: 'Farah' },
  { phone: '60120000001', name: 'Restoran Ah Seng' },
  { phone: '60120000002', name: 'Kafe Bunga' },
];
// each sample switches to its customer, then sends
const SAMPLES = [
  { label: 'Aina: chocolate cake (urgent)', who: '60120000011', text: 'I want 2 chocolate cakes for Saturday, urgent please' },
  { label: 'Mei Ling: price question', who: '60120000012', text: 'Do you still have cheesecake? How much?' },
  { label: 'Kevin: Shopee is cheaper', who: '60120000014', text: 'How much is the red velvet? Shopee is a bit cheaper' },
  { label: 'Farah: will think first', who: '60120000015', text: 'ok let me think about it first' },
  { label: 'Ali: spam ×5', who: '60120000013', spam: ['hello', 'hi??', 'got pandan cake?', '??', 'please reply'] },
  { label: 'Kevin: I\'ll take one!', who: '60120000014', text: 'ok I will take one red velvet tomorrow' },
  { label: '🎤 Ah Seng voice', who: '60120000001', voice: 'boss tomorrow I want three chocolate cakes and two cheesecakes' },
  { label: 'unknown item', text: 'I want 2 chocolate cakes and 3 more barrels' },
  { label: 'where is my order?', text: 'when will my order arrive?' },
  { label: 'never mind', text: 'never mind, thank you' },
  { label: 'talk to the owner', text: 'boss' },
  { label: 'Malay order', text: 'nak 2 kek coklat utk sabtu' },
  { label: 'Chinese question', text: '芝士蛋糕还有吗？多少钱？' },
];
const PHONES = [
  { key: 'customer', role: 'Customer', customer: true },
  { key: 'owner', phone: '60110000001', name: 'Kak Lina', role: 'Owner · approver', staffId: 'u1' },
  { key: 'sup', phone: '60110000002', name: 'Faizal', role: 'Supervisor · backup approver', staffId: 'u2' },
  { key: 'staff', phone: '60110000003', name: 'Ravi', role: 'Staff · packing & delivery', staffId: 'u3' },
];

let messages = [];
let lastId = '';
const chosen = {}; // messageId -> buttonId clicked
const state = { customerPhone: CUSTOMERS[0].phone, voice: {}, image: {} };
const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const linkify = (s) => esc(s).replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank">$1</a>');
const initials = (n) => n.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join('').toUpperCase();
const hhmm = (iso) => new Date(iso).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); setTimeout(() => el.classList.remove('show'), 1800); }

function phoneNumberOf(p) { return p.customer ? state.customerPhone : p.phone; }

function render() {
  const root = $('#phones');
  if (!root.children.length) {
    root.innerHTML = PHONES.map((p) => `
      <section class="phone" data-key="${p.key}">
        <div class="phone-head">
          <div class="avatar">${p.customer ? '🛒' : initials(p.name)}</div>
          <div class="who">
            ${p.customer
              ? `<select class="custSel">${CUSTOMERS.map((c) => `<option value="${c.phone}">${esc(c.name)}</option>`).join('')}</select>`
              : `<b>${esc(p.name)} <span class="leave-tag" hidden>on leave</span></b>`}
            <span>${esc(p.role)}</span>
          </div>
        </div>
        <div class="chat"></div>
        <div class="composer">
          ${p.customer ? `<div class="chips">${SAMPLES.map((s, i) => `<button class="chip" data-sample="${i}">${esc(s.label)}</button>`).join('')}</div>` : ''}
          <div class="hint" hidden></div>
          <div class="attach" hidden></div>
          <div class="row">
            ${p.customer ? `<button class="icon-btn mic" title="Voice note (type what is said)">🎤</button>
            <label class="icon-btn" title="Photo of order list">📷<input type="file" accept="image/*" hidden class="file"></label>` : ''}
            <input type="text" placeholder="${p.customer ? 'Type an order…' : 'Type a message…'}">
            <button class="send" title="Send">➤</button>
          </div>
        </div>
      </section>`).join('');
    wire();
  }
  for (const p of PHONES) {
    const el = root.querySelector(`[data-key="${p.key}"]`);
    const num = phoneNumberOf(p);
    const mine = messages.filter((m) => (m.direction === 'in' && m.from === num) || (m.direction === 'out' && m.to === num));
    const chat = $('.chat', el);
    const atBottom = chat.scrollHeight - chat.scrollTop - chat.clientHeight < 40;
    chat.innerHTML = mine.length ? mine.map(bubble).join('') : `<div class="empty">${p.customer ? 'Pick a sample below or type your own order.' : 'No messages yet. Order cards will appear here.'}</div>`;
    if (atBottom || chat.dataset.n !== String(mine.length)) chat.scrollTop = chat.scrollHeight;
    chat.dataset.n = mine.length;
  }
}

function bubble(m) {
  const t = `<time>${hhmm(m.ts)}</time>`;
  if (m.direction === 'in') {
    let body = linkify(m.text);
    if (m.type === 'audio') body = `🎤 <b>Voice note</b><span class="sub">“${esc(m.text)}”</span>`;
    if (m.type === 'image') body = `📷 <b>Photo</b>${m.text ? `<span class="sub">${esc(m.text)}</span>` : ''}`;
    if (m.type === 'button') body = `↩︎ ${esc(m.text)}`;
    return `<div class="msg me">${body}${t}</div>`;
  }
  const err = m.error ? `<span class="err">WhatsApp error: ${esc(m.error)}</span>` : '';
  if (m.type === 'document') {
    return `<div class="msg them"><a class="doc" href="${esc(m.url)}" target="_blank"><span class="ico">PDF</span><span><b>${esc(m.filename)}</b><br><span class="muted">Tap to open</span></span></a>${esc(m.caption || '')}${err}${t}</div>`;
  }
  let html = `<div class="msg them">${linkify(m.text || m.fallbackText || '')}${err}${t}</div>`;
  if (m.type === 'buttons') {
    const pick = chosen[m.id];
    html += `<div class="buttons">${m.buttons.map((b) => `<button data-mid="${m.id}" data-bid="${esc(b.id)}" data-title="${esc(b.title)}" ${pick ? 'disabled' : ''} class="${pick === b.id ? 'chosen' : ''}">${esc(b.title)}</button>`).join('')}</div>`;
  }
  return html;
}

async function post(url, body) {
  const r = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body || {}) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) toast(j.error || 'Error');
  return j;
}

async function sendFrom(phone, payload) {
  await post('/api/sim/send', { from: phone, ...payload });
  poll();
}

function wire() {
  document.querySelectorAll('.phone').forEach((el) => {
    const p = PHONES.find((x) => x.key === el.dataset.key);
    const input = $('input[type=text]', el);
    const hint = $('.hint', el);
    const attach = $('.attach', el);
    const send = async () => {
      const text = input.value.trim();
      const num = phoneNumberOf(p);
      if (p.customer && state.voice[p.key]) {
        if (!text) return toast('Type what is said in the voice note');
        state.voice[p.key] = false; $('.mic', el).classList.remove('on'); hint.hidden = true;
        input.value = ''; return sendFrom(num, { type: 'audio', transcript: text, name: CUSTOMERS.find((c) => c.phone === num)?.name });
      }
      if (p.customer && state.image[p.key]) {
        const img = state.image[p.key]; state.image[p.key] = null; attach.hidden = true;
        input.value = ''; return sendFrom(num, { type: 'image', caption: text, mediaBase64: img.b64, mimeType: img.type });
      }
      if (!text) return;
      input.value = '';
      sendFrom(num, { type: 'text', text, name: CUSTOMERS.find((c) => c.phone === num)?.name });
    };
    $('.send', el).onclick = send;
    input.onkeydown = (e) => { if (e.key === 'Enter') send(); };
    if (p.customer) {
      $('.custSel', el).onchange = (e) => { state.customerPhone = e.target.value; render(); };
      $('.mic', el).onclick = () => {
        state.voice[p.key] = !state.voice[p.key];
        $('.mic', el).classList.toggle('on', state.voice[p.key]);
        hint.hidden = !state.voice[p.key];
        hint.textContent = '🎤 Voice note mode: type what the customer says (simulated speech-to-text), then send.';
        input.focus();
      };
      $('.file', el).onchange = (e) => {
        const f = e.target.files[0]; if (!f) return;
        const rd = new FileReader();
        rd.onload = () => {
          state.image[p.key] = { b64: String(rd.result).split(',')[1], type: f.type };
          attach.hidden = false;
          attach.innerHTML = `<img src="${rd.result}"> Photo selected. Add a caption (e.g. the order list) and press send.`;
        };
        rd.readAsDataURL(f);
      };
      el.querySelectorAll('.chip').forEach((c) => c.onclick = async () => {
        const s = SAMPLES[Number(c.dataset.sample)];
        if (s.who && s.who !== state.customerPhone) { state.customerPhone = s.who; $('.custSel', el).value = s.who; render(); }
        const num = state.customerPhone;
        const name = CUSTOMERS.find((x) => x.phone === num)?.name;
        if (s.voice) return sendFrom(num, { type: 'audio', transcript: s.voice, name });
        if (s.spam) { for (const t of s.spam) { await sendFrom(num, { type: 'text', text: t, name }); await new Promise((r) => setTimeout(r, 250)); } return; }
        sendFrom(num, { type: 'text', text: s.text, name });
      });
    }
    el.addEventListener('click', (e) => {
      const b = e.target.closest('.buttons button');
      if (!b || b.disabled) return;
      chosen[b.dataset.mid] = b.dataset.bid;
      render();
      sendFrom(phoneNumberOf(p), { type: 'button', buttonId: b.dataset.bid, title: b.dataset.title });
    });
  });
  $('#reset').onclick = async () => {
    if (!confirmReset()) return;
    await post('/api/demo/reset');
    messages = []; lastId = ''; Object.keys(chosen).forEach((k) => delete chosen[k]);
    render(); toast('Demo reset');
  };
}
function confirmReset() { return true; }
document.getElementById('scenario').onclick = async () => { await post('/api/demo/scenario'); poll(); toast('Mei Ling, Aina, Kevin wrote · Ali spammed — open the Orbyte inbox'); };

async function poll() {
  try {
    const r = await fetch('/api/sim/messages?since=' + encodeURIComponent(lastId));
    const fresh = await r.json();
    if (fresh.length) { messages.push(...fresh); lastId = fresh.at(-1).id; render(); }
  } catch (e) { /* server restarting */ }
}
async function loadMode() {
  try {
    const s = await (await fetch('/api/state')).json();
    $('#modeAi').textContent = 'AI: ' + (s.mode.ai === 'none' ? 'rule parser' : s.mode.ai);
    $('#modeAi').className = 'badge ' + (s.mode.ai === 'none' ? '' : 'ok');
    $('#modeWa').textContent = 'WhatsApp: ' + s.mode.whatsapp;
    $('#modeWa').className = 'badge ' + (s.mode.whatsapp === 'cloud' ? 'ok' : '');
    let moved = false;
    for (const st of s.staff) {
      const p = PHONES.find((x) => x.staffId === st.id);
      if (p && p.phone !== st.phone) { p.phone = st.phone; moved = true; } // real number from OWNER_PHONE etc.
      const tag = p && document.querySelector(`[data-key="${p.key}"] .leave-tag`);
      if (tag) tag.hidden = !st.onLeave;
    }
    if (moved) render();
  } catch (e) {}
}
render(); poll(); loadMode();
setInterval(poll, 1000);
setInterval(loadMode, 4000);
</script>
</body>
</html>
